[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carmen-biosignal"
version = "2.0.0"
description = "CARMEN — a cardiorespiratory foundation model for continuous physiological waveforms"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["foundation-model", "biosignal", "ecg", "ppg", "abp", "waveform", "transformer"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "einops>=0.7",
]

[project.urls]
Homepage = "https://github.com/dlcjfgmlnasa/CARMEN"
Releases = "https://github.com/dlcjfgmlnasa/CARMEN/releases"

[tool.setuptools.packages.find]
include = ["carmen*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
